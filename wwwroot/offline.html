<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c3a">
  <title>Sin conexión · Cafetería</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:#f4f7f4;color:#18302e;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,440px);background:#fff;border:1px solid #d8e5df;border-radius:22px;padding:32px;text-align:center;box-shadow:0 12px 40px #123c3a16}
    img{width:88px;height:88px}h1{font-size:25px;margin:16px 0 10px}p{color:#637b75;line-height:1.6;margin:0 0 24px}
    button{font:inherit;color:#fff;background:#245d58;border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" width="88" height="88" alt="Cafetería">
    <h1>No hay conexión</h1>
    <p>Para consultar productos, iniciar sesión y registrar pedidos necesitas Internet y conexión con el servidor de la cafetería. No se guardó ningún pedido.</p>
    <button type="button" onclick="location.reload()">Volver a intentar</button>
  </main>
</body>
</html>
