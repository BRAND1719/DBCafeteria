<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categorías · Cafetería</title>
  <meta name="theme-color" content="#123c3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cafetería">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="categorias" data-titulo="Categorías">
<div class="layout">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="principal">
    <header id="topbar" class="topbar"></header>
    <main class="contenido">

      <div class="barra-herramientas">
        <div class="grow"><input type="search" id="buscar" placeholder="Buscar categoría…" aria-label="Buscar"></div>
        <div id="filtros-extra" style="display:flex;gap:10px"></div>
        <button class="btn btn-primario" id="btn-nuevo">+ Nueva categoría</button>
      </div>
      <div class="tarjeta"><div class="tabla-wrap"><table id="tabla"><thead></thead><tbody></tbody></table></div></div>
    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script>
iniciarCrud({
  entidad: 'Categoría', plural: 'categorías', ruta: '/Categoria', id: 'idCategoria',
  columnas: [
    { titulo: 'Nombre', campo: 'nombre' },
    { titulo: 'Descripción', campo: 'descripcion' },
    { titulo: 'Estatus', render: c => badgeEstatus(c.estatus) }
  ],
  campos: [
    { campo: 'nombre', etiqueta: 'Nombre', requerido: true, max: 50, completo: true },
    { campo: 'descripcion', etiqueta: 'Descripción', tipo: 'textarea', max: 200, completo: true },
    { campo: 'estatus', etiqueta: 'Estatus', tipo: 'estatus' }
  ]
});
</script>
</body>
</html>
