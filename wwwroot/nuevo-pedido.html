<!DOCTYPE html>
<!--
  MODULO DISENO - Captura de nuevo pedido
  Usa estilos.css y el menu compartido de app.js
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo pedido · Cafetería</title>
  <meta name="theme-color" content="#123c3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cafetería">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/estilos.css?v=3">
</head>
<body data-pagina="nuevo-pedido" data-titulo="Nuevo pedido">
<div class="layout">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="principal">
    <header id="topbar" class="topbar"></header>
    <main class="contenido">

      <div class="pedido-layout">
        <section>
          <input type="search" id="buscar" placeholder="Buscar producto…" aria-label="Buscar producto">
          <div class="chips" id="chips"></div>
          <div class="grid-productos" id="grid-productos"><div class="vacio" style="grid-column:1/-1">Cargando productos…</div></div>
        </section>

        <aside class="tarjeta ticket">
          <h2 class="tarjeta-titulo">Pedido actual</h2>
          <div class="tarjeta-cuerpo">
            <div class="campo">
              <label for="cliente">Cliente *</label>
              <select id="cliente"><option value="">Cargando…</option></select>
            </div>
            <div class="campo">
              <label for="pago">Método de pago *</label>
              <select id="pago">
                <option>Efectivo</option>
                <option>Tarjeta</option>
                <option>Transferencia</option>
              </select>
            </div>

            <div class="ticket-lineas" id="lista-carrito"></div>

            <div class="ticket-total"><span>Total</span><span id="total">$0.00</span></div>
            <div id="aviso" class="aviso" hidden></div>
            <button class="btn btn-primario btn-bloque" id="btn-confirmar">Confirmar pedido</button>
            <button class="btn btn-secundario btn-bloque" id="btn-vaciar" style="margin-top:8px">Vaciar pedido</button>
          </div>
        </aside>
      </div>
    </main>
  </div>
</div>

<script src="js/app.js?v=3"></script>
<script src="js/nuevo-pedido.js?v=3"></script>
</body>
</html>
