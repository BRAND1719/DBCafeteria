<!DOCTYPE html>
<!--
  MODULO DISENO - Reportes de existencia baja y mas vendidos
  Usa estilos.css y el menu compartido de app.js
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes · Cafetería</title>
  <meta name="theme-color" content="#123c3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cafetería">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="reportes" data-titulo="Reportes">
<div class="layout">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="principal">
    <header id="topbar" class="topbar"></header>
    <main class="contenido">

      <div class="tarjeta" style="margin-bottom:18px">
        <div class="tabla-titulo">
          <h2 style="font-size:16px">Productos con existencia baja</h2>
          <div class="filtro"><label for="limite">Mostrar con existencia de</label>
            <input type="number" id="limite" min="0" value="5" style="width:110px"></div>
        </div>
        <div class="tabla-wrap"><table id="tabla-bajos">
          <thead><tr><th>Producto</th><th>Categoría</th><th class="num">Precio</th><th class="num">Existencia</th></tr></thead>
          <tbody></tbody></table></div>
      </div>

      <div class="tarjeta">
        <div class="tabla-titulo">
          <h2 style="font-size:16px">Productos más vendidos</h2>
          <div class="filtro"><label for="top">Cantidad a mostrar</label>
            <input type="number" id="top" min="1" value="10" style="width:110px"></div>
        </div>
        <div class="tabla-wrap"><table id="tabla-top">
          <thead><tr><th>#</th><th>Producto</th><th>Categoría</th><th class="num">Vendidos</th><th class="num">Ingresos</th></tr></thead>
          <tbody></tbody></table></div>
      </div>
    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/reportes.js"></script>
</body>
</html>
